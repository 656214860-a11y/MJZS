name: 分镜处理
stage_id: "storyboard"
process_id: "01_storyboard_draft"
steps:
  - index: 1
    name: 读取剧本
    action: read_script
    needs_confirmation: false
  - index: 2
    name: 拆解场景
    action: split_scenes
    needs_confirmation: false
  - index: 3
    name: 生成分镜
    action: generate_storyboard
    needs_confirmation: true
    question: "场景清单已生成，是否开始生成分镜？"
  - index: 4
    name: 写入 storyboard_draft.json
    action: write_storyboard_draft
    needs_confirmation: false
