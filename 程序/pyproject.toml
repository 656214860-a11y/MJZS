# 仅开发期工具配置；运行时零第三方依赖，本文件不进分发副本（见 distribution_manifest.md）。
[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/architecture/_canary", "skills", "reference", "运行环境", "data", "private", "outputs"]

[tool.ruff.lint]
# 第一阶段只拦真缺陷：语法错误、未定义名、字典重复键。F401/F841 等存量过大，另走棘轮。
select = ["E9", "F821", "F601"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["service_contract.py", "error_codes.py"]
